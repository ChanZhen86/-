<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽奖轮盘</title>
<!-- 样式见 style.css，逻辑见 app.js -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>幸运抽奖轮盘</h1>
<p class="subtitle">点击轮盘或按钮开始抽奖 · 可自定义奖项</p>

<!-- 轮盘 -->
<div class="main">
  <div class="wheel-area">
    <div class="pointer"></div>
    <div class="wheel-frame">
      <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    <div class="hub" id="spinBtn" title="开始抽奖">开 奖</div>
  </div>
</div>

<!-- 抽奖记录 -->
<div class="history">
  <h3>📋 抽奖记录</h3>
  <ul class="history-list" id="historyList">
    <li style="opacity:.35;border:none">暂无记录</li>
  </ul>
</div>

<!-- 奖项设置 -->
<div class="panel">
  <h2>🎯 奖项设置 <small class="hint">点击 ×N 可单独调整概率权重</small></h2>

  <ul class="prize-list" id="prizeList"></ul>

  <div class="add-row">
    <input type="text" id="nameInput" placeholder="奖项名称" maxlength="12" />
    <input type="number" id="weightInput" placeholder="权重" min="1" max="100" value="1" />
    <button class="btn btn-add" id="addBtn">添加</button>
  </div>

  <div class="panel-actions">
    <button class="btn btn-spin" id="spinBtnMain">开始抽奖</button>
    <button class="btn btn-clear" id="resetBtn">恢复默认奖项</button>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="overlay" id="overlay">
  <div class="result-box">
    <div class="emoji">🎉</div>
    <div class="label">恭喜获得</div>
    <div class="prize-name" id="resultName">—</div>
    <button class="btn" id="closeBtn">太棒了！</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
